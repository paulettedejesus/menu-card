<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Card</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
  <h1>The Vegan Master - Menu Card</h1> 
  <form id="menu-form">
  <label for="menu-input">Paste your menu as JSON</label>
  <textarea id="menu-input" rows="8">
    [
  {"name": "Taco", "price": 4.5},
  {"name": "Burrito", "price": 9},
  {"name": "Nachos", "price": 6.25},
  {"name": "Churro", "price": 3}
    ]
  </textarea>

  <button type="submit">Show my menu</button>
</form> 

<p id="count"></p>
<p id="menu-text"></p>


    <script src="script.js"></script>
</body>
</html>
