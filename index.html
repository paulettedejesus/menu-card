<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Card</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
  <h1>The Vegan Master - Menu Card</h1> 
  <form id="menu-form">
  <label for="menu-input">Paste your menu as JSON</label>
  <textarea id="menu-input" rows="8">
    [
  {"name": "Mushroom Lentil Fajitas", "price": 15.5},
  {"name": "Tomato and Basil Soup", "price": 8},
  {"name": "Zucchini Pasta", "price": 9.50},
  {"name": "Mediterranean Grilled Avocado Stuffed with Chick Peas And Tahini", "price": 13}
    ]
  </textarea>

  <button type="submit">Show my menu</button>
</form> 

<p id="count"></p>
<p id="menu-text"></p>


    <script src="script.js"></script>
</body>
</html>
